<!doctype html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>this old house</title>
<link rel="icon" href="../favicon.png">
<style>
:root{
  --ink:#000000d9;      /* body text          */
  --mid:#00000075;      /* secondary text     */
  --faint:#00000038;    /* watched, disabled  */
  --line:#0000001a;     /* hairlines          */
  color-scheme:light;   /* keep native controls light-themed */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:200;
  font-style:normal;
  font-size:15px;
  line-height:1.6;
  color:var(--ink);
  background-color:rgb(255,255,255);
  text-align:center;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 5vw 12vh}
a{color:inherit;text-decoration:none}

/* ---------- masthead: the home page's title / tagline pairing ---------- */
.mast{padding:6vh 0 0}
.mast .up{font-size:13px;letter-spacing:2px;color:var(--faint);transition:color .3s linear}
.mast .up:hover{color:var(--mid)}
h1{
  font-size:3vw;font-weight:200;letter-spacing:2px;
  margin:.4em 0 .1em;color:var(--ink);
}
.tagline{font-size:1.5vw;font-weight:lighter;letter-spacing:2px;color:var(--mid)}

/* ---------- one quiet line of controls ---------- */
.tools{
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
  gap:0 22px;margin:5vh 0 3vh;font-size:13px;letter-spacing:2px;
}
button{font:inherit;cursor:pointer;color:inherit}
.btn{
  background:none;border:0;padding:0;letter-spacing:2px;
  color:var(--mid);transition:color .3s linear;
}
.btn:hover{color:var(--ink)}
.btn.primary{color:var(--ink)}
.rule{height:1px;background:var(--line);margin-bottom:3vh}

/* ---------- player ---------- */
.stage{position:relative;background:#fff}
.stage video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.placeholder{
  display:flex;flex-direction:column;justify-content:center;
  gap:4px;border:1px solid var(--line);color:var(--faint);
  font-size:13px;letter-spacing:2px;padding:9vh 20px;
}
.placeholder b{display:block;color:var(--mid);font-weight:200;font-size:18px}
#err{
  display:none;padding:14px 4px 0;font-size:12px;
  letter-spacing:1px;line-height:1.8;color:var(--mid);
}
#err b{font-weight:400;color:var(--ink)}

.nowbar{
  display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;
  gap:0 22px;padding:3vh 0 0;font-size:13px;letter-spacing:2px;
}
.nowtitle{color:var(--ink)}
.nowtitle span{color:var(--faint);margin-left:14px}

/* ---------- season picker ---------- */
h2{
  font-size:12px;font-weight:200;letter-spacing:2px;color:var(--faint);
  margin:7vh 0 2.5vh;padding-bottom:8px;border-bottom:1px solid var(--line);
}
h2.picker{
  display:flex;justify-content:center;align-items:baseline;
  flex-wrap:wrap;gap:0 14px;
}
.selectWrap{position:relative;display:inline-block}
.selectWrap::after{                   /* the only chrome the select gets */
  content:"";position:absolute;right:2px;top:.55em;pointer-events:none;
  border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:4px solid var(--faint);
}
#seasons{
  font:inherit;font-size:12px;font-weight:200;letter-spacing:2px;
  color:var(--mid);background:none;border:0;border-radius:0;
  padding:0 16px 2px 0;cursor:pointer;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  transition:color .3s linear;
}
#seasons:hover{color:var(--ink)}
#seasons:focus{outline:none;color:var(--ink)}

/* ---------- episodes ---------- */
.eps{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:3.5vh 10px;
}
.ep{
  background:none;border:0;padding:0 0 7px;position:relative;
  color:var(--mid);transition:color .3s linear;
}
.ep:hover{color:var(--ink)}
.ep .code{font-size:14px;letter-spacing:2px}
.ep .state{
  display:block;font-size:10px;letter-spacing:1px;color:var(--faint);
  margin-top:2px;min-height:16px;
}
.ep.done{color:var(--faint)}          /* watched recedes             */
.ep.now{color:var(--ink)}             /* current stands out in black */
.ep.now .code{border-bottom:1px solid var(--ink);padding-bottom:2px}
.ep .pb{position:absolute;left:26%;right:26%;bottom:0;height:1px;background:var(--faint);
        transform:scaleX(0);transform-origin:left;transition:transform .3s linear}
.check{display:none}

/* ---------- metadata for the playing episode ---------- */
#epMeta{
  max-width:56ch;margin:3.5vh auto 0;font-size:13px;line-height:1.9;
  color:var(--mid);letter-spacing:.3px;
}
#epMeta .epname{
  font-size:16px;color:var(--ink);letter-spacing:1px;margin-bottom:.5em;
}
#epMeta p{margin:0}

footer{
  margin-top:9vh;padding-top:3vh;border-top:1px solid var(--line);
  font-size:11px;letter-spacing:1px;line-height:2.2;color:var(--faint);
}
footer b{font-weight:400;color:var(--mid)}

@media (max-width:700px){
  h1{font-size:7vw}
  .tagline{font-size:3.4vw}
  .eps{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .tools,.nowbar{gap:0 16px}
  .nowtitle{width:100%;margin-bottom:4px}
  .nowtitle span{display:block;margin:0}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="mast">
    <a class="up" href="../index.html">keillor witt</a>
    <h1>this old house</h1>
    <div class="tagline">41 seasons &middot; 1041 episodes</div>
  </div>

  <div class="tools">
    <button class="btn primary" id="resume">resume</button>
  </div>

  <div class="rule"></div>

  <div class="stage">
    <video id="video" controls playsinline preload="metadata" style="display:none"></video>
    <div class="placeholder" id="placeholder">
      <b>pick an episode</b>
      <span>or resume where you left off</span>
    </div>
    <div id="err"></div>
  </div>

  <div class="nowbar">
    <div class="nowtitle" id="nowTitle">nothing playing</div>
    <button class="btn" id="prev">prev</button>
    <button class="btn" id="next">next</button>
    <button class="btn" id="toggleDone">mark watched</button>
  </div>

  <div id="epMeta"></div>

  <h2 class="picker">
    <span class="selectWrap"><select id="seasons" aria-label="season"></select></span>
    <span id="epsHead"></span>
  </h2>
  <div class="eps" id="eps"></div>

  <footer>
    <b>space</b> play &middot; <b>&larr; &rarr;</b> seek &middot; <b>f</b> fullscreen
  </footer>
</div>

<script src="episodes.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
(function () {
  "use strict";

  var EPS   = window.TOH_EPISODES || [];
  var BASE  = window.TOH_BASE;
  var KEY   = "toh.progress.v1";
  var KEYAT = "toh.current.v1";

  var video = document.getElementById("video");
  var ph    = document.getElementById("placeholder");
  var errEl = document.getElementById("err");
  var hls   = null;
  var cur   = -1;          // index into EPS, playing now
  var queued= -1;          // restored from last visit, not loaded into the element yet
  var seekedOnce = false;

  /* ---------- model ---------- */
  function key(i){ return EPS[i][0] + "-" + EPS[i][1]; }
  function code(i){
    return "S" + String(EPS[i][0]).padStart(2,"0") + "E" + String(EPS[i][1]).padStart(2,"0");
  }
  function url(i){ return BASE + EPS[i][2] + ".m3u8"; }

  var store = load();
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch(e){ return {}; }
  }
  /* newest record wins, and "done" is never undone by a merge */
  function merge(into, from){
    var changed = false;
    Object.keys(from || {}).forEach(function(k){
      var a = into[k], b = from[k];
      if (!b) return;
      if (!a || (b.ts || 0) > (a.ts || 0)){ into[k] = b; changed = true; }
      else if (b.done && !a.done){ a.done = true; changed = true; }
    });
    return changed;
  }

  var saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  function saveNow(){
    clearTimeout(saveTimer);
    try {
      merge(store, load());          // pick up anything another tab wrote
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch(e){}
  }
  function rec(i){ return store[key(i)] || null; }
  function setCurrent(i){
    try { localStorage.setItem(KEYAT, key(i)); } catch(e){}
  }
  function getCurrent(){
    var k;
    try { k = localStorage.getItem(KEYAT); } catch(e){ k = null; }
    if (k) { for (var i=0;i<EPS.length;i++) if (key(i) === k) return i; }
    // fall back to the most recently touched episode
    var best = -1, bestTs = -1;
    for (var j=0;j<EPS.length;j++){
      var r = rec(j);
      if (r && r.ts > bestTs){ bestTs = r.ts; best = j; }
    }
    return best;
  }
  /* the next unwatched episode at or after i */
  function nextUnwatched(from){
    for (var i=Math.max(0,from);i<EPS.length;i++){
      var r = rec(i);
      if (!r || !r.done) return i;
    }
    return -1;
  }
  function pct(i){
    var r = rec(i);
    if (!r) return 0;
    if (r.done) return 1;
    if (!r.d || !r.t) return 0;
    return Math.min(1, r.t / r.d);
  }
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
    return (h ? h + ":" + String(m).padStart(2,"0") : String(m)) + ":" + String(s).padStart(2,"0");
  }

  /* ---------- playback ---------- */
  function play(i, autoplay){
    if (i < 0 || i >= EPS.length) return;
    if (cur >= 0 && cur !== i) remember(true);
    cur = i;
    queued = -1;
    seekedOnce = false;
    setCurrent(i);
    errEl.style.display = "none";
    ph.style.display = "none";
    video.style.display = "block";

    var src = url(i);
    if (hls){ hls.destroy(); hls = null; }

    if (window.Hls && window.Hls.isSupported()){
      hls = new window.Hls({ maxBufferLength: 30, enableWorker: true });
      hls.on(window.Hls.Events.ERROR, function(evt, data){
        if (!data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) { fail("network"); }
        else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); } catch(e){ fail("media"); } }
        else fail(data.details || "playback");
      });
      hls.loadSource(src);
      hls.attachMedia(video);
      if (autoplay !== false) hls.on(window.Hls.Events.MANIFEST_PARSED, tryPlay);
    } else if (video.canPlayType("application/vnd.apple.mpegurl")){
      video.src = src;                         // Safari / iOS play HLS natively
      if (autoplay !== false) video.addEventListener("loadedmetadata", tryPlay, { once:true });
    } else if (!window.Hls){
      fail("library");
    } else {
      fail("unsupported");
    }

    render();
    paintNow();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function tryPlay(){ var p = video.play(); if (p && p.catch) p.catch(function(){}); }

  function fail(what){
    errEl.innerHTML = (what === "library")
      ? "<b>the player library did not load.</b> check the network, then reload."
      : "<b>this stream would not load (" + what + ").</b> " +
        "the cdn may want a fresh link, or may block playback from this page.";
    errEl.style.display = "block";
  }

  /* resume position once metadata is known */
  video.addEventListener("loadedmetadata", function(){
    if (cur < 0 || seekedOnce) return;
    seekedOnce = true;
    var r = rec(cur);
    if (r && !r.done && r.t > 30 && (!video.duration || r.t < video.duration - 30)){
      try { video.currentTime = r.t; } catch(e){}
    }
  });

  function remember(force){
    if (cur < 0) return;
    var d = isFinite(video.duration) ? video.duration : 0;
    var t = video.currentTime || 0;
    if (!d && !t && !force) return;
    var r = store[key(cur)] || {};
    r.t = t; if (d) r.d = d;
    r.ts = Date.now();
    if (d && t / d >= 0.95) r.done = true;
    store[key(cur)] = r;
    save();
    paintTile(cur);
  }

  var tick = null;
  video.addEventListener("playing", function(){
    clearInterval(tick);
    tick = setInterval(remember, 5000);
  });
  ["pause","seeked","waiting"].forEach(function(ev){
    video.addEventListener(ev, function(){ remember(); });
  });
  video.addEventListener("ended", function(){
    clearInterval(tick);
    if (cur < 0) return;
    var r = store[key(cur)] || {};
    r.done = true; r.t = 0; r.ts = Date.now();
    store[key(cur)] = r;
    saveNow();
    if (cur + 1 < EPS.length) play(cur + 1, true);
    else { render(); paintNow(); }
  });
  window.addEventListener("pagehide", function(){ remember(true); saveNow(); });
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){ remember(true); saveNow(); }
  });

  /* ---------- episode metadata ----------------------------------------
     Titles and descriptions are not stored in this repo. The page asks
     tvmaze for them once, caches the answer for a month, and shows what
     comes back. No metadata simply means no metadata - nothing else on
     the page depends on it.                                          */
  var META_KEY = "toh.meta.v1";
  var META_URL = "https://api.tvmaze.com/shows/1802/episodes";   /* 1802 = this old house */
  var META_TTL = 30 * 24 * 3600 * 1000;
  var meta = null;

  function metaLoad(){
    try { return JSON.parse(localStorage.getItem(META_KEY)); } catch(e){ return null; }
  }

  /* summaries arrive as html - take the text only, and never parse it into
     this document (DOMParser neither runs scripts nor loads resources) */
  function textOf(html){
    if (!html) return "";
    try {
      var doc = new DOMParser().parseFromString(String(html), "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    } catch(e){ return ""; }
  }

  /* a season's project is whatever its episode titles all begin with:
     "The Westwood House - 1", "... - 2" -> "The Westwood House".
     A season that ran several projects has no common prefix, and gets
     no title - which is the honest answer for those years.           */
  function commonPrefix(names){
    if (!names.length) return "";
    var pre = names[0];
    for (var i = 1; i < names.length; i++){
      var b = names[i], j = 0;
      while (j < pre.length && j < b.length && pre.charAt(j) === b.charAt(j)) j++;
      pre = pre.slice(0, j);
      if (!pre) return "";
    }
    return pre;
  }
  function seasonTitle(names){
    var t = commonPrefix(names).trim();
    t = t.replace(/[\s\-\u2013\u2014:,]+$/, "")
         .replace(/\s+(part|pt\.?|episode|ep\.?|no\.?)$/i, "")
         .replace(/[\s\-\u2013\u2014:,]+$/, "");
    return t.length >= 4 ? t : "";
  }

  function metaBuild(list){
    var eps = {}, names = {}, seasons = {};
    list.forEach(function(e){
      if (!e || typeof e.season !== "number" || typeof e.number !== "number") return;
      eps[e.season + "-" + e.number] = { n: e.name || "", s: textOf(e.summary) };
      (names[e.season] = names[e.season] || []).push(e.name || "");
    });
    Object.keys(names).forEach(function(sn){
      var t = seasonTitle(names[sn].filter(Boolean));
      if (t) seasons[sn] = t;
    });
    return { ts: Date.now(), eps: eps, seasons: seasons };
  }

  function metaFetch(force){
    var cached = metaLoad();
    if (cached && cached.eps) meta = cached;                 /* show what we have */
    if (!force && cached && (Date.now() - (cached.ts || 0)) < META_TTL) return;
    if (!window.fetch) return;
    fetch(META_URL, { mode: "cors" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(list){
        if (!Array.isArray(list) || !list.length) return;
        meta = metaBuild(list);
        try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e){}
        render(); paintNow();
      })
      .catch(function(){});                                  /* offline - stay quiet */
  }

  function epMeta(i){ return (meta && meta.eps) ? meta.eps[key(i)] : null; }
  function seasonName(sn){ return (meta && meta.seasons) ? (meta.seasons[sn] || "") : ""; }

  /* ---------- rendering ---------- */
  var seasons = [];
  for (var i=0;i<EPS.length;i++) if (seasons.indexOf(EPS[i][0]) === -1) seasons.push(EPS[i][0]);
  var shown = seasons[0];

  var seasonsEl = document.getElementById("seasons");
  var epsEl     = document.getElementById("eps");
  var epsHead   = document.getElementById("epsHead");
  var tiles     = {};                 // episode index -> button

  function seasonDone(s){
    var all = true, any = false;
    for (var i=0;i<EPS.length;i++){
      if (EPS[i][0] !== s) continue;
      any = true;
      var r = rec(i);
      if (!r || !r.done){ all = false; break; }
    }
    return any && all;
  }

  function renderSeasons(){
    seasonsEl.innerHTML = "";
    seasons.forEach(function(s){
      var o = document.createElement("option");
      var sn = seasonName(s);
      o.value = s;
      o.textContent = "season " + s + (sn ? " \u00b7 " + sn : "") +
                      (seasonDone(s) ? " \u00b7 watched" : "");
      if (s === shown) o.selected = true;
      seasonsEl.appendChild(o);
    });
    seasonsEl.value = String(shown);
  }

  function here(){ return cur >= 0 ? cur : queued; }

  function paintTile(i){
    var b = tiles[i];
    if (!b) return;
    var r = rec(i), p = pct(i);
    b.className = "ep" + (r && r.done ? " done" : "") + (i === here() ? " now" : "");
    var state = "";
    if (r && r.done) state = "watched";
    else if (r && r.t > 30 && r.d) state = fmt(r.d - r.t) + " left";
    else if (r && r.t > 30) state = "at " + fmt(r.t);
    b.querySelector(".state").textContent =
      (i === cur) ? (state ? "playing · " + state : "playing")
                  : (i === queued && cur < 0) ? (state ? "next \u00b7 " + state : "next")
                  : state;
    /* the bar marks part-watched only - "watched" already says the rest */
    b.querySelector(".pb").style.transform = "scaleX(" + ((r && r.done) ? 0 : p) + ")";
    b.querySelector(".check").textContent = "";
  }

  function render(){
    renderSeasons();
    var list = [];
    for (var i=0;i<EPS.length;i++) if (EPS[i][0] === shown) list.push(i);
    var doneCount = list.filter(function(i){ var r = rec(i); return r && r.done; }).length;
    epsHead.textContent = doneCount + " of " + list.length + " watched";

    epsEl.innerHTML = "";
    tiles = {};
    list.forEach(function(i){
      var b = document.createElement("button");
      b.innerHTML = '<span class="code"></span><span class="state"></span>' +
                    '<span class="check"></span><i class="pb"></i>';
      b.querySelector(".code").textContent = code(i);
      var em = epMeta(i);
      if (em && em.n) b.title = em.n;
      b.onclick = function(){ play(i, true); };
      b.oncontextmenu = function(e){ e.preventDefault(); toggleDone(i); };
      epsEl.appendChild(b);
      tiles[i] = b;
      paintTile(i);
    });
  }

  function paintNow(){
    var t = document.getElementById("nowTitle");
    var i = cur >= 0 ? cur : queued;
    if (i < 0){ t.textContent = "nothing playing"; return; }
    t.textContent = code(i);
    document.getElementById("toggleDone").textContent =
      (rec(i) && rec(i).done) ? "mark unwatched" : "mark watched";
    document.title = code(i) + " \u2014 this old house";

    var box = document.getElementById("epMeta");
    box.textContent = "";
    var m = epMeta(i);
    if (!m || (!m.n && !m.s)) return;
    if (m.n){
      var h = document.createElement("div");
      h.className = "epname";
      h.textContent = m.n;                  /* text only - never innerHTML */
      box.appendChild(h);
    }
    if (m.s){
      var para = document.createElement("p");
      para.textContent = m.s;
      box.appendChild(para);
    }
  }

  function toggleDone(i){
    var r = store[key(i)] || {};
    r.done = !r.done;
    if (r.done) r.t = 0;
    r.ts = Date.now();
    store[key(i)] = r;
    saveNow();
    paintTile(i);
    renderSeasons();
    if (i === here()) paintNow();
  }

  /* ---------- controls ---------- */
  seasonsEl.onchange = function(){ shown = +this.value; render(); };

  document.getElementById("prev").onclick = function(){ var i = here(); if (i > 0) play(i - 1, true); };
  document.getElementById("next").onclick = function(){ var i = here(); if (i >= 0 && i + 1 < EPS.length) play(i + 1, true); };
  document.getElementById("toggleDone").onclick = function(){ var i = here(); if (i >= 0) toggleDone(i); };

  document.getElementById("resume").onclick = function(){
    var i = here();
    if (i < 0){                             // nothing seen yet, or progress was erased
      var n = nextUnwatched(0);
      i = (n >= 0) ? n : 0;
    } else if (cur < 0 && rec(i) && rec(i).done){
      var n2 = nextUnwatched(i + 1);
      if (n2 >= 0) i = n2;
    }
    shown = EPS[i][0];
    play(i, true);
  };

  /* another tab (or another window on this device) moved the progress along */
  window.addEventListener("storage", function(e){
    if (e.key && e.key !== KEY) return;
    if (merge(store, load())){ render(); paintNow(); }
  });

  /* keyboard */
  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key){
      case " ":  if (cur >= 0){ e.preventDefault(); video.paused ? tryPlay() : video.pause(); } break;
      case "ArrowLeft":  if (cur >= 0){ e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); } break;
      case "ArrowRight": if (cur >= 0){ e.preventDefault(); video.currentTime = video.currentTime + 10; } break;
      case "n": case "N": if (here() >= 0 && here() + 1 < EPS.length) play(here() + 1, true); break;
      case "p": case "P": if (here() > 0) play(here() - 1, true); break;
      case "f": case "F": if (cur >= 0 && video.requestFullscreen) video.requestFullscreen(); break;
    }
  });

  /* ---------- boot ---------- */
  var start = getCurrent();
  if (start >= 0){
    var r0 = rec(start);
    var finished = !!(r0 && r0.done);
    if (finished){
      var n = nextUnwatched(start + 1);
      queued = (n >= 0) ? n : Math.min(start + 1, EPS.length - 1);
    } else {
      queued = start;
    }
    shown = EPS[queued][0];
    document.getElementById("resume").textContent =
      finished ? "play " + code(queued) : "resume " + code(queued);
    var rq = rec(queued);
    ph.innerHTML = "<b>" + code(queued) + "</b><span>" +
      (finished ? "next after " + code(start)
                : (rq && rq.t > 30 ? "paused at " + fmt(rq.t)
                                   : "not started")) +
      " \u2014 press resume</span>";
    paintNow();
  }

  render();
  metaFetch(false);
})();
</script>
</body>
</html>
